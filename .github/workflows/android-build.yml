name: Android build

on:
  push:
    branches: [main, claude-apk-review]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Test and build Padho
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run translation unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: padho-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Restore Padho release signing key
        if: ${{ secrets.PADHO_KEYSTORE_BASE64 != '' }}
        env:
          PADHO_KEYSTORE_BASE64: ${{ secrets.PADHO_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          printf '%s' "$PADHO_KEYSTORE_BASE64" | base64 --decode > app/keystore/padho-release.jks

      - name: Build signed release APK
        if: ${{ secrets.PADHO_KEYSTORE_BASE64 != '' && secrets.PADHO_KEYSTORE_PASSWORD != '' && secrets.PADHO_KEY_ALIAS != '' && secrets.PADHO_KEY_PASSWORD != '' }}
        env:
          PADHO_KEYSTORE_PATH: app/keystore/padho-release.jks
          PADHO_KEYSTORE_PASSWORD: ${{ secrets.PADHO_KEYSTORE_PASSWORD }}
          PADHO_KEY_ALIAS: ${{ secrets.PADHO_KEY_ALIAS }}
          PADHO_KEY_PASSWORD: ${{ secrets.PADHO_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: ${{ secrets.PADHO_KEYSTORE_BASE64 != '' && secrets.PADHO_KEYSTORE_PASSWORD != '' && secrets.PADHO_KEY_ALIAS != '' && secrets.PADHO_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: padho-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
